<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Verificar tu cuenta | CasaLista</title>
  <link rel="icon" href="assets/IconoLogo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CodigoVerificacion.css">
</head>
<body>
  <main class="page">
    <!-- Manchas decorativas del fondo (solo escritorio) -->
    <span class="decor decor-top-left" aria-hidden="true"></span>
    <span class="decor decor-top-center" aria-hidden="true"></span>
    <span class="decor decor-bottom-center" aria-hidden="true"></span>
    <span class="decor decor-bottom-right" aria-hidden="true"></span>

    <section class="card">
      <div class="illustration">
        <img src="assets/SobreCodigo.svg" alt="Sobre abierto con una carta que muestra un código de verificación">
      </div>

      <div class="divider" aria-hidden="true"></div>

      <div class="form-section">
        <h1 class="title">Verificar tu cuenta</h1>
        <h2 class="subtitle">Ingresa el codigo de verificación</h2>
        <p class="description">Hemos enviado un codigo de 8 digitos a tu correo electronico</p>

        <form id="verificationForm" class="form" novalidate>
          <fieldset class="code-inputs" id="codeInputs" aria-describedby="message">
            <legend class="sr-only">Código de verificación de 8 dígitos</legend>
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Dígito 1">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 2">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 3">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 4">
            <span class="separator" aria-hidden="true"></span>
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 5">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 6">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 7">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 8">
          </fieldset>

          <p class="message" id="message" role="alert" aria-live="polite"></p>

          <div class="resend">
            <p>¿No recibiste el codigo?</p>
            <button type="button" class="resend-btn">Reenviar codigo</button>
          </div>

          <div class="buttons">
            <button type="submit" class="btn btn-verify">Verificar cuenta</button>
            <button type="button" class="btn btn-back" id="backBtn">Volver</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="CodigoVerificacion.js"></script>
</body>
</html>
