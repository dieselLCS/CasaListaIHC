<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffcf7">
  <title>Cuenta verificada | CasaLista</title>
  <link rel="icon" href="assets/IconoLogo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CuentaVerificada.css">
</head>
<body>
  <main class="page">
    <!-- Manchas decorativas del fondo (solo escritorio) -->
    <span class="decor decor-top-left" aria-hidden="true"></span>
    <span class="decor decor-top-center" aria-hidden="true"></span>
    <span class="decor decor-bottom-center" aria-hidden="true"></span>
    <span class="decor decor-bottom-right" aria-hidden="true"></span>

    <!-- Título de la pantalla (visible solo en móvil) -->
    <h1 class="page-title">Verificar tu cuenta</h1>

    <section class="card" aria-labelledby="tituloVerificada">
      <div class="illustration">
        <img src="assets/SobreVerificado.svg" alt="Sobre abierto con una carta y un check de verificación">
      </div>

      <div class="divider" aria-hidden="true"></div>

      <div class="content">
        <h2 id="tituloVerificada">¡Cuenta verificada!</h2>
        <p>
          Tu cuenta se creó correctamente.<br>
          Ya puedes empezar a usar CasaLista.
        </p>
        <a class="btn-primary" href="../Plataforma - Cliente/Servicio.html">Ir al inicio</a>
      </div>
    </section>
  </main>
</body>
</html>
