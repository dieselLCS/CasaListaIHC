<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffdfa" />
    <title>Iniciar sesión | CasaLista</title>
    <link rel="icon" href="Assets/IconoLogo.png" type="img/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="IniciarSesion.css" />
  </head>
  <body>
    <main class="login-page">
      <div class="decor decor-top-left" aria-hidden="true"></div>
      <div class="decor decor-top-center" aria-hidden="true"></div>
      <div class="decor decor-right" aria-hidden="true"></div>
      <div class="decor decor-bottom-left" aria-hidden="true"></div>
      <div class="decor decor-bottom-center" aria-hidden="true"></div>
      <div class="decor decor-bottom-right" aria-hidden="true"></div>

      <header class="brand" aria-label="CasaLista">
        <a class="brand-link" href="#" aria-label="CasaLista, inicio">
          <img
            class="brand-icon"
            src="Assets/IconoLogo.png"
            alt="Logo de CasaLista"
          />
          <span class="brand-name">Casa<span>Lista</span></span>
        </a>
      </header>

      <section class="content">
        <div class="illustration-panel">
          <img
            src="assets/MujerRelajadaConMovilYPerro.png"
            alt="Una mujer descansando en un sofá mientras usa su teléfono, acompañada de su perro"
          />
        </div>

        <div class="vertical-divider" aria-hidden="true"></div>

        <section class="form-panel" aria-labelledby="welcome-title">
          <div class="form-inner">
            <h1 id="welcome-title">Bienvenido <span>de nuevo</span></h1>
            <p class="intro">
              Inicia sesión para gestionar tus servicios del hogar<br
                class="desktop-break"
              />
              de forma simple y segura.
            </p>

            <form id="loginForm" novalidate>
              <div class="field">
                <label class="sr-only" for="email">Correo electrónico</label>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2.5" />
                  <path d="m4 7 8 6 8-6" />
                </svg>
                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="Correo electrónico"
                  autocomplete="email"
                  aria-describedby="emailError"
                />
                <small class="error-message" id="emailError"></small>
              </div>

              <div class="field password-field">
                <label class="sr-only" for="password">Contraseña</label>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="11" rx="2" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                  <path d="M12 14v3" />
                </svg>
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Contraseña"
                  autocomplete="current-password"
                  aria-describedby="passwordError"
                />
                <button
                  class="toggle-password"
                  id="togglePassword"
                  type="button"
                  aria-label="Mostrar contraseña"
                  aria-pressed="false"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"
                    />
                    <circle cx="12" cy="12" r="2.7" />
                  </svg>
                </button>
                <small class="error-message" id="passwordError"></small>
              </div>

              <div class="form-options">
                <label class="remember">
                  <input type="checkbox" id="remember" checked />
                  <span class="custom-check" aria-hidden="true">
                    <svg viewBox="0 0 16 16">
                      <path d="m3 8 3.2 3.2L13 4.8" />
                    </svg>
                  </span>
                  <span>Recordarme</span>
                </label>
                <a class="forgot-link" href="#" id="forgotLink"
                  >¿Olvidaste tu contraseña?</a
                >
              </div>

              <div
                class="form-feedback"
                id="formFeedback"
                role="alert"
                aria-live="polite"
              ></div>

              <button class="primary-button" type="submit">
                Iniciar sesión
              </button>
              <a class="secondary-button" href="CrearCuentaCliente.html"
                >Crear cuenta</a
              >
            </form>

            <div class="separator">
              <span></span>
              <p>o continúa con</p>
              <span></span>
            </div>
            <button
              class="google-button"
              type="button"
              aria-label="Continuar con Google"
            >
              <span class="google-g" aria-hidden="true">G</span>
            </button>

            <p class="legal-text">Al continuar, aceptas nuestros</p>
            <p class="legal-links">
              <a href="#">Términos de Servicio</a> y
              <a href="#">Política de Privacidad</a>
            </p>
          </div>
        </section>
      </section>
    </main>
    <script src="IniciarSesion.js"></script>
  </body>
</html>
