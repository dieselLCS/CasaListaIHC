<svg xmlns="http://www.w3.org/2000/svg" id="Quieto" viewBox="0 0 400 300" width="800" height="600" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Profesional de CasaLista llevando un paquete en moto">
  <style>
    .Rueda{transform-box:fill-box;transform-origin:center;animation:Girar .7s linear infinite}
    .Moto{animation:Vaiven .9s ease-in-out infinite}
    .Pista{animation:Avanzar .7s linear infinite}
    .Viento{animation:Soplar 1.2s linear infinite}
    .Viento2{animation-delay:-.4s}
    .Viento3{animation-delay:-.8s}
    .Humo{transform-box:fill-box;transform-origin:center;animation:Salir 1.4s ease-out infinite}
    .Humo2{animation-delay:-.7s}
    .Brillo{animation:Titilar 1.8s ease-in-out infinite}
    .Pin{animation:Flotar 1.8s ease-in-out infinite}
    @keyframes Girar{to{transform:rotate(360deg)}}
    @keyframes Vaiven{50%{transform:translateY(-1.6px)}}
    @keyframes Avanzar{to{stroke-dashoffset:36}}
    @keyframes Soplar{0%{opacity:0;transform:translateX(12px)}25%{opacity:1}100%{opacity:0;transform:translateX(-26px)}}
    @keyframes Salir{0%{opacity:.9;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-26px,-10px) scale(1.25)}}
    @keyframes Titilar{50%{opacity:.45}}
    @keyframes Flotar{50%{transform:translateY(-4px)}}
    #Quieto:target,#Quieto:target *{animation:none!important}
  </style>
